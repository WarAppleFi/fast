<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Multiplayer</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
        font-family: Arial, sans-serif;
        color: white;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(2, 6, 23, 0.8);
        z-index: 10;
        cursor: pointer;
        font-size: 24px;
        user-select: none;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        background: rgba(15, 23, 42, 0.7);
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="overlay">Нажмите, чтобы войти в игру</div>
    <div id="hud">WASD — движение · мышь — смотреть · клик — захватить курсор</div>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
