name = "do-shooter"
main = "server.js"
compatibility_date = "2024-01-01"

[[durable_objects]]
bindings = [
  { name = "ROOM", class_name = "GameRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["GameRoom"]

# Опционально: настройки для production
[env.production]
vars = { ENVIRONMENT = "production" }

# Опционально: настройки для development
[env.development]
vars = { ENVIRONMENT = "development" }
