name = "js-multiplayer-3d"
type = "rust"
main = "src/lib.rs"
compatibility_date = "2024-09-23"

[build]
command = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && ~/.cargo/bin/cargo install -q worker-build && ~/.cargo/bin/worker-build --release"

[build.upload]
format = "wasm"

[durable_objects]
bindings = [{ name = "GAME_ROOM", class_name = "GameRoom" }]

[[migrations]]
tag = "v1"
new_classes = ["GameRoom"]  # тоже меняем
